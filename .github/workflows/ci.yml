name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python compilation
        run: python -m compileall -q bot scripts tests
      - name: Ruff
        run: python -m ruff check .
      - name: Formatting
        run: python -m ruff format --check .
      - name: Unit and contract tests
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_contract.py

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_ADMIN_DSN: postgresql://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Create isolated test roles
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ['PG_TEST_ADMIN_DSN'], autocommit=True) as db:
              db.execute('CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN BYPASSRLS')
          PY
      - run: python tests/postgres_integration.py
      - run: python -m playwright install --with-deps chromium webkit
      - name: Browser interactions
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/bashkir-web.log 2>&1 &
          python tests/browser_checks.py
      - name: Responsive interface without CDN
        run: python tests/browser_visual_checks.py
      - name: Sidebar scrollspy and contextual navigation
        run: python tests/browser_navigation_checks.py
      - name: Real static Bashkir audio
        run: python tests/browser_tts_checks.py
      - name: Original audio range playback
        run: python tests/browser_original_audio_checks.py
      - name: Mobile Chromium and WebKit checks
        run: python tests/browser_mobile_checks.py
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-screenshots
          retention-days: 14
          path: |
            test-results/visual/
            test-results/mobile/
            test-results/visual-polish/

  docker-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/docker_integration.py
      - name: Original audio evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-audio-evidence
          retention-days: 14
          path: test-results/visual/original-audio-mobile.png
          if-no-files-found: ignore
